version: '3.8'

services:
  rust_verusd_rpc_server:
    image: verustrading/rust_rpc_server:0.1
    ports:
      - "${LISTEN_PORT}:${LISTEN_PORT}"
    networks:
      baskets:
        ipv4_address: ${RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${RPC_URL}
      - LISTEN_PORT=${LISTEN_PORT}
      - RPC_USER=${RPC_USER}
      - RPC_PASS=${RPC_PASS}
    restart: unless-stopped
networks:
  baskets:
    name: basket_conversions_baskets
    external: true
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_CONVERSIONS_NETWORK_SUBNET}
