version: '3.8'

services:
  rpcserver:
    image: syncproofdev/rust_verusd_rpc_server:0.1
    ports:
      - "${LISTEN_PORT}:${LISTEN_PORT}"
    networks:
      pbaas_network:
        ipv4_address: ${RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${RPC_URL}
      - LISTEN_PORT=${LISTEN_PORT}
      - RPC_USER=${RPC_USER}
      - RPC_PASS=${RPC_PASS}
    restart: unless-stopped

networks:
  pbaas_network:
    name: ${DOCKER_NETWORK_NAME}
    external: true

