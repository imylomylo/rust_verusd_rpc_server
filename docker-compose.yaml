version: '3.8'

services:
  rust_verusd_rpc_server:
    build: .
    ports:
      - "${LISTEN_PORT}:${LISTEN_PORT}"
    networks:
      vrsctest_net:
        ipv4_address: ${RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${RPC_URL}
      - LISTEN_PORT=${LISTEN_PORT}
      - RPC_USER=${RPC_USER}
      - RPC_PASS=${RPC_PASS}
    restart: unless-stopped
networks:
  vrsctest_net:
    name: prelaunch-chips-crosschain-500_vrsctest_prelaunch_chips
    external: true
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_VRSCTEST_NET_NETWORK_SUBNET}
