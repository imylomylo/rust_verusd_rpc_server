version: '3.8'

services:
  vrsc_rust_verusd_rpc_server:
    build: .
    ports:
      - "${VRSC_LISTEN_PORT}:${VRSC_LISTEN_PORT}"
    networks:
      baskets_net:
        ipv4_address: ${VRSC_RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${VRSC_RPC_URL}
      - LISTEN_PORT=${VRSC_LISTEN_PORT}
      - RPC_USER=${VRSC_RPC_USER}
      - RPC_PASS=${VRSC_RPC_PASS}
    restart: unless-stopped
  varrr_rust_verusd_rpc_server:
    build: .
    ports:
      - "${VARRR_LISTEN_PORT}:${VARRR_LISTEN_PORT}"
    networks:
      baskets_net:
        ipv4_address: ${VARRR_RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${VARRR_RPC_URL}
      - LISTEN_PORT=${VARRR_LISTEN_PORT}
      - RPC_USER=${VARRR_RPC_USER}
      - RPC_PASS=${VARRR_RPC_PASS}
    restart: unless-stopped
  vdex_rust_verusd_rpc_server:
    build: .
    ports:
      - "${VDEX_LISTEN_PORT}:${VDEX_LISTEN_PORT}"
    networks:
      baskets_net:
        ipv4_address: ${VDEX_RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${VDEX_RPC_URL}
      - LISTEN_PORT=${VDEX_LISTEN_PORT}
      - RPC_USER=${VDEX_RPC_USER}
      - RPC_PASS=${VDEX_RPC_PASS}
    restart: unless-stopped
  chips_rust_verusd_rpc_server:
    build: .
    ports:
      - "${CHIPS_LISTEN_PORT}:${CHIPS_LISTEN_PORT}"
    networks:
      baskets_net:
        ipv4_address: ${CHIPS_RUST_RPC_SERVER_IPV4}
    environment:
      - RPC_URL=${CHIPS_RPC_URL}
      - LISTEN_PORT=${CHIPS_LISTEN_PORT}
      - RPC_USER=${CHIPS_RPC_USER}
      - RPC_PASS=${CHIPS_RPC_PASS}
    restart: unless-stopped
networks:
  baskets_net:
    name: ${DOCKER_NETWORK_NAME}
    external: true
    ipam:
      driver: default
      config:
        - subnet: ${DOCKER_VRSC_NET_NETWORK_SUBNET}
